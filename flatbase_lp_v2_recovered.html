<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FLAT BASE inc. - PR Event Production Company">
    <meta name="theme-color" content="#111111">
    <title>FLAT BASE - PR Event Production | 一気通貫でPRイベント制作</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Reset & Variables */
        :root {
            --black: #111;
            --dark: #1a1a1a;
            --dark-mid: #222;
            --gray-dark: #555;
            --gray-mid: #999;
            --gray-light: #e8e6e3;
            --off-white: #f7f6f4;
            --white: #fff;
            --accent: #c8a86e;
            --accent-dark: #b8964e;
            --accent-light: #dcc9a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--dark);
            background-color: var(--off-white);
            line-height: 1.7;
            letter-spacing: 0.05em;
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            line-height: 1.2;
        }

        .display-heading {
            font-family: 'Cormorant Garamond', serif;
            font-size: 72px;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: capitalize;
            margin-bottom: 24px;
        }

        .section-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--gray-dark);
            margin-bottom: 48px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-label::before {
            content: '';
            width: 20px;
            height: 2px;
            background-color: var(--accent);
        }

        /* Container */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 48px;
        }

        /* Buttons */
        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 14px 32px;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(.22,.61,.36,1);
            display: inline-block;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--white);
            border: 2px solid var(--accent);
        }

        .btn-primary:hover {
            background-color: var(--accent-dark);
            border-color: var(--accent-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
        }

        .btn-secondary:hover {
            background-color: var(--accent);
            color: var(--white);
            transform: translateY(-2px);
        }

        .btn-outline-white {
            background-color: transparent;
            color: var(--white);
            border: 2px solid var(--white);
        }

        .btn-outline-white:hover {
            background-color: var(--white);
            color: var(--dark);
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background-color: transparent;
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(.22,.61,.36,1);
        }

        header.scrolled {
            background-color: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .logo {
            width: 120px;
            height: auto;
            display: flex;
            align-items: center;
            transition: all 0.3s cubic-bezier(.22,.61,.36,1);
        }

        .logo img {
            width: 100%;
            height: auto;
        }

        nav {
            display: flex;
            gap: 48px;
            align-items: center;
        }

        nav a {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--white);
            text-decoration: none;
            transition: color 0.3s cubic-bezier(.22,.61,.36,1);
            opacity: 0.8;
        }
