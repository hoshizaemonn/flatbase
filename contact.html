      <main>
      <!-- contact -->
        <div class="Contact Section">
          <div class="Container">
            <div class="Container">
              <h2 class="Vision_Title">Contact</h2>
              <div class="Form">
                <div class="Form_Inner">
                  <div class="Complete">
                    <div class="Complete_Inner">
                      <p class="Complete_Title">THANK YOU!</p>
                      <p class="Complete_Message">送信完了しました。</p><a class="Complete_Button" href="/">BACK TO HOME</a>
                    </div>
                  </div>
                  <div class="TextRow">
                    <label class="TextRow_Label"><span class="TextRow_Label_Title">氏名<span class="required">*必須</span></span>
                      <input class="TextRow_Input Input_FullName" type="text" maxlength="64"><span class="Error">The Full Name entered is not valid</span>
                    </label>
                  </div>
                  <div class="TextRow">
                    <label class="TextRow_Label"><span class="TextRow_Label_Title">フリガナ<span class="required">*必須</span></span>
                      <input class="TextRow_Input Input_Kana" type="text" maxlength="64"><span class="Error"></span>
                    </label>
                  </div>
                  <div class="TextRow">
                    <label class="TextRow_Label"><span class="TextRow_Label_Title">会社名<span class="required">*必須</span></span>
                      <input class="TextRow_Input Input_Company" type="text" maxlength="255"><span class="Error">The Company entered is not valid</span>
                    </label>
                  </div>
                  <div class="TextRow">
                    <label class="TextRow_Label"><span class="TextRow_Label_Title">メールアドレス<span class="required">*必須</span></span>
                      <input class="TextRow_Input Input_Email" type="text"><span class="Error">有効なメールアドレスを入力してください</span>
                    </label>
                  </div>
                  <div class="TextRow">
                    <label class="TextRow_Label"><span class="TextRow_Label_Title">お問い合わせ種類<span class="required">*必須</span></span>
                      <div class="Select_Outer">
                        <select class="TextRow_Input Select Input_Category">
                          <option>選択してください</option>
                          <option>コンサルティングについて</option>
                          <option>PRコミュニケーション/デジタルマーケティングについて</option>
                          <option>イベント/プロモーションについて</option>
                          <option>SNS/インフルエンサーマーケティングについて</option>
                          <option>D2Cについて</option>
                          <option>その他</option>
                        </select>
                      </div><span class="Error">The selected value is not valid</span>
                    </label>
                  </div>
                  <div class="TextRow">
                    <label class="TextRow_Label"><span class="TextRow_Label_Title">お問い合わせ内容</span>
                      <textarea class="TextRow_Textarea Input_Message" rows="7"></textarea>
                    </label>
                  </div>
                  <!--.CheckRow-->
                  <!--  label.CheckRow_Label-->
                  <!--    input.CheckRow_Input.Check_Consent(type="checkbox")-->
                  <!--    span.CheckRow_Checkbox-->
                  <!--    span.CheckRow_Title I agree to Flat Base’s <a href="/privacy-policy/" target="_blank">Privacy Policy</a>-->
                  <div class="SubmitRow">
                    <button class="SubmitRow_Button">送信</button>
                  </div>
                </div>
              </div>
